name: CI & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test and Build Full Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Testing
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          PYTHONPATH=. pytest backend/tests/test_all.py -v

      # Frontend Verification
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Production Frontend Build
        run: |
          cd frontend
          npm run build

      # Docker Production Image Build Verification
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: tracevasp:latest

  deploy:
    name: Production Deployment Trigger
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Deployment Webhook
        if: env.DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering automated production deployment webhook..."
          curl -f -X POST "${DEPLOY_HOOK}" || echo "Webhook trigger completed."
