services:
  - type: web
    name: sih-182-tracevasp
    env: docker
    dockerfilePath: Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SAHYOG_MOCK_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: tracevasp-postgres
          property: connectionString

databases:
  - name: tracevasp-postgres
    databaseName: tracevasp
    user: postgres
    region: oregon
    plan: free
