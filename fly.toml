app = "sih-182-tracevasp"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  SAHYOG_MOCK_MODE = "true"
  HOST = "0.0.0.0"
  PORT = "8000"
